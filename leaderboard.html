
<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b241a">

  <title>Leaderboard | Odense Bulldogs</title>

  <link rel="icon" type="image/png" href="assets/bulldogs-logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/leaderboard.css">
  <script type="module" src="js/public-competition.js"></script>
</head>

<body class="leaderboard-page">

  <main class="leaderboard-layout">

    <!-- Logo -->
    <header class="leaderboard-brand">
      <img src="assets/bulldogs-logo.png" alt="Odense Bulldogs">
      <span>ODENSE BULLDOGS</span>
    </header>

    <!-- Overskrift -->
    <section class="leaderboard-heading">
      <p class="leaderboard-eyebrow">KAMPENS PAUSE</p>

      <h1>Leaderboard</h1>

      <p>
        Se hvem der har klaret sig bedst i
        <strong>Hold pucken i live</strong>.
      </p>

      <p id="public-round-title" class="competition-label"></p>
      <p id="public-status" class="firebase-status" role="status">Henter leaderboard…</p>
    </section>

    <section class="ranking-section" id="public-results" hidden>
      <div class="ranking-heading"><h2>Kampens top 5</h2></div>
      <ol id="public-rankings" class="ranking-list"></ol>
    </section>

    <a href="spiller.html" class="back-to-player">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 12H5M12 19L5 12L12 5"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>

      Tilbage til forsiden
    </a>

    <footer class="leaderboard-footer">
      <span>ODENSE BULLDOGS</span>
      <span>ÉT HOLD. ÉN BY. ODENSE.</span>
    </footer>

  </main>

</body>
</html>
